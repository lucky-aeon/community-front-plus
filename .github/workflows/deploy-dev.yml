name: Deploy Dev

on:
  push:
    branches: ["dev"]
  pull_request:
    types: [closed]
    branches: ["dev"]
  workflow_dispatch: {}

concurrency:
  group: dev-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      DEPLOY_IMAGE: ghcr.nju.edu.cn/${{ github.repository }}
      TAG_SHA: dev-${{ github.sha }}
    outputs:
      image: ${{ steps.out-image.outputs.image }}
      pull_image: ${{ steps.out-image.outputs.pull_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Show dist size
        run: du -sh dist

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static artifact image
        run: |
          set -e
          time docker build \
            -f deploy/Dockerfile.static \
            -t "${GHCR_IMAGE}:${TAG_SHA}" \
            -t "${GHCR_IMAGE}:dev-latest" \
            dist

      - name: Push static artifact image
        run: |
          set -e
          time docker push "${GHCR_IMAGE}:${TAG_SHA}"
          time docker push "${GHCR_IMAGE}:dev-latest"

      - name: Compute image names
        id: out-image
        run: |
          echo "image=${GHCR_IMAGE}:${TAG_SHA}" >> "$GITHUB_OUTPUT"
          echo "pull_image=${DEPLOY_IMAGE}:${TAG_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy static files (dev)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: dev
      url: ${{ vars.DEPLOY_PUBLIC_URL }}
    steps:
      - name: Deploy via SSH (dev)
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          PULL_IMAGE: ${{ needs.build-and-push.outputs.pull_image }}
          BASE_DIR: ${{ secrets.DEPLOY_BASE_DIR }}
          TARGET_NAME: dev
          EXTRACT_CONTAINER: community-front-plus-extract-${{ github.run_id }}-${{ github.run_number }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: IMAGE,PULL_IMAGE,BASE_DIR,TARGET_NAME,EXTRACT_CONTAINER
          script: |
            set -euo pipefail

            pull_with_retry() {
              image="$1"
              attempt=1
              while [ "$attempt" -le 3 ]; do
                if docker pull "$image"; then
                  return 0
                fi
                echo "[deploy] Pull failed for $image (attempt $attempt/3)" >&2
                sleep $((attempt * 2))
                attempt=$((attempt + 1))
              done
              return 1
            }

            TARGET_DIR="$BASE_DIR/$TARGET_NAME"
            TMP_DIR="$BASE_DIR/.tmp_${TARGET_NAME}_${{ github.run_id }}_${{ github.run_number }}"
            case "$TARGET_DIR" in
              "$BASE_DIR"/dev) ;;
              *) echo "Refuse to touch unexpected target: $TARGET_DIR" >&2; exit 1;;
            esac

            echo "[deploy] IMAGE=$IMAGE"
            echo "[deploy] PULL_IMAGE=$PULL_IMAGE"
            echo "[deploy] TARGET_DIR=$TARGET_DIR"

            RUN_IMAGE="$PULL_IMAGE"
            if ! pull_with_retry "$PULL_IMAGE"; then
              echo "[deploy] Mirror pull failed, falling back to IMAGE=$IMAGE" >&2
              pull_with_retry "$IMAGE"
              RUN_IMAGE="$IMAGE"
            fi

            rm -rf "$TMP_DIR"
            mkdir -p "$TMP_DIR" "$TARGET_DIR"
            trap 'docker rm -f "$EXTRACT_CONTAINER" >/dev/null 2>&1 || true; rm -rf "$TMP_DIR"' EXIT
            docker rm -f "$EXTRACT_CONTAINER" >/dev/null 2>&1 || true
            docker create --name "$EXTRACT_CONTAINER" "$RUN_IMAGE" >/dev/null
            docker cp "$EXTRACT_CONTAINER:/dist/." "$TMP_DIR/"
            docker rm -f "$EXTRACT_CONTAINER" >/dev/null

            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete --exclude='.user.ini' "$TMP_DIR"/ "$TARGET_DIR"/
            else
              echo "WARN: rsync not found, fallback to copy" >&2
              find "$TARGET_DIR" -mindepth 1 -not -name '.user.ini' -exec rm -rf {} +
              cp -a "$TMP_DIR"/. "$TARGET_DIR"/
            fi
            echo "[deploy] Done. Synced $RUN_IMAGE to $TARGET_DIR"
